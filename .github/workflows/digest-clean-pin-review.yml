name: Digest exact-pin worktree safety (read only)
on:
  push:
    branches:
      - chatgpt/digest-clean-pin-gate-20261019
  pull_request:
    paths:
      - scripts/prepare_digest_upstream.py
      - tests/test_digest_clean_pin.py
      - .github/workflows/digest-clean-pin-review.yml
permissions:
  contents: read
jobs:
  dirty-pin-negative-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test real disposable Git repository without external upstream install
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: python -B -X utf8 -m unittest discover -s tests -p test_digest_clean_pin.py -v
