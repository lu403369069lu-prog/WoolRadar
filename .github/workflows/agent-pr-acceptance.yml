name: WoolRadar unprivileged source PR acceptance
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Reviewed WoolRadar source branch or exact commit
        type: string
        required: true
        default: chatgpt/wr-h07-public-corpus-url-limit-fixture-20261018
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'core/**'
      - 'tests/**'
      - 'config/**'
      - 'independent-quality/**'
      - '.github/workflows/agent-pr-acceptance.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-pr-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: wr-source-formal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-formal:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_ref || 'chatgpt/wr-h07-public-corpus-url-limit-fixture-20261018' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed when source or test suite is absent
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('tests'); assert p.is_dir() and list(p.glob('test_*.py')), 'No WoolRadar source test files'"
          python -c "from pathlib import Path; assert Path('core').is_dir(), 'No original core source'"
          git rev-parse HEAD
      - name: Prepare disposable original-source test fixture root
        shell: pwsh
        run: New-Item -ItemType Directory -Force .test-tmp | Out-Null
      - name: Run full original-source regression; require zero skipped tests
        shell: pwsh
        run: |
          @'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print('STRICT_RESULTS run=%d skipped=%d expected_failures=%d errors=%d failures=%d' %
                (result.testsRun, len(result.skipped), len(result.expectedFailures),
                 len(result.errors), len(result.failures)))
          sys.exit(0 if result.wasSuccessful() and result.testsRun > 0
                   and not result.skipped and not result.expectedFailures
                   and not result.unexpectedSuccesses else 1)
          '@ | python -
