name: Engineering acceptance checkpoint
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Commit or branch to validate (empty = current branch)'
        required: false
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [chatgpt/actions-acceptance-checkpoint-20261018]
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout tracked engineering source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || 'chatgpt/wr-h07-public-corpus-url-limit-fixture-20261018' }}
          path: candidate
          persist-credentials: false
      - name: Print exact tested candidate commit
        run: git -C candidate rev-parse HEAD
      - name: Checkout historical ledger for queue checkpoint
        uses: actions/checkout@v4
        with:
          ref: chatgpt/scheduled-review-ledger-20261017
          path: ledger
          persist-credentials: false
      - name: Verify real historical queue and create relay checkpoint
        run: python .github/scripts/relay_queue.py
      - name: Upload relay checkpoint even when acceptance fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: .relay-checkpoint/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run bounded acceptance and generate machine-readable checkpoint
        id: acceptance
        shell: bash
        run: |
          cd candidate
          python ../.github/scripts/engineering_acceptance.py
      - name: Upload checkpoint even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/.engineering-acceptance/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
