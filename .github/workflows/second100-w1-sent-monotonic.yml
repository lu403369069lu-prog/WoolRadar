name: Second100 W1 SENT monotonic SQLite invariant
on:
  pull_request:
    branches: [chatgpt/second100-w1-notice-stale-file-20261018]
  push:
    branches: [chatgpt/second100-w1-sent-monotonic-20261018]
permissions:
  contents: read
jobs:
  sent-monotonic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: R2-001 real local and subprocess SENT guard
        run: python -X utf8 -m unittest discover -s tests -p test_notice_sent_monotonic.py -v
      - name: Existing original notification behavior
        run: python -X utf8 -m unittest discover -s tests -p test_notifications.py -v
      - name: Existing stale local worker fencing
        run: python -X utf8 -m unittest discover -s tests -p test_notice_stale_local_writer.py -v
